---
# deployer bootstrap - deploy vedicon-context and vedicon-workspace, inject in .zshrc
#
# copies both scripts to the deployer-cli and sources them in .zshrc
# functions are then available as `vedicon-context` and `vedicon-workspace`

- name: DEPLOYER BOOTSTRAP - COPY vedicon-CONTEXT.SH TO DEPLOYER-CLI
  ansible.builtin.copy:
    src: vedicon-context.sh
    dest: "/home/{{ DEPLOYER_CLI_USER }}/vedicon-context.sh"
    owner: "{{ DEPLOYER_CLI_USER }}"
    group: "{{ DEPLOYER_CLI_USER }}"
    mode: "0644"

- name: DEPLOYER BOOTSTRAP - COPY vedicon-WORKSPACE.SH TO DEPLOYER-CLI
  ansible.builtin.copy:
    src: vedicon-workspace.sh
    dest: "/home/{{ DEPLOYER_CLI_USER }}/vedicon-workspace.sh"
    owner: "{{ DEPLOYER_CLI_USER }}"
    group: "{{ DEPLOYER_CLI_USER }}"
    mode: "0644"

- name: DEPLOYER BOOTSTRAP - INJECT vedicon TOOLS SOURCE IN .ZSHRC
  ansible.builtin.blockinfile:
    path: "/home/{{ DEPLOYER_CLI_USER }}/.zshrc"
    marker: "# {mark} vedicon CONTEXT"
    insertafter: EOF
    block: |
      # vedicon — workspace tools
      source "$HOME/vedicon-context.sh"
      source "$HOME/vedicon-workspace.sh"
